# The native macOS Lite shell embeds the Web surface in WKWebView. It keeps
# the browser transport, while replacing JSONL Session persistence with the
# same authoritative SQLite database used by the Electron shell.

# Include patches require a matching package name for id-targeted updates.
# Disable the base provider, then mount SQLite under its own row id.
- id: session-persistence-jsonl
  disabled: true

# The desktop products start without an implicit first-party route. Users add
# the provider routes they intend to use through Models settings.
- id: llm-deepseek
  disabled: true

- insert:
    - id: session-persistence-sqlite
      name: '@deepseek-ai/dsh-session-persistence-sqlite'
      config:
        path: !!js dshHomePath('desktop', 'dsh-desktop.sqlite')

    - id: external-tools
      name: '@deepseek-ai/dsh-external-tools'

    - id: file-recognizer-office
      name: '@deepseek-ai/dsh-file-recognizer-office'

    - id: ui-deepseek-files
      name: '@deepseek-ai/dsh-client-ui-deepseek-files'

    - id: ui-skill-library
      name: '@deepseek-ai/dsh-client-ui-skill-library'

    - id: ui-plugin-library
      name: '@deepseek-ai/dsh-client-ui-plugin-library'

    - id: model-catalog
      name: '@deepseek-ai/dsh-model-catalog'
      config:
        catalogURL: https://models.dev/api.json
        refreshIntervalMs: 86400000
        requestTimeoutMs: 15000
        maxResponseBytes: 8388608

    # The Lite product ships the native Cua Driver provider; the shared
    # registration service comes from the base bundle.
    - id: computer-use-cua-driver-native
      name: '@deepseek-ai/dsh-computer-use-cua-driver-native'

    - id: lark
      name: '@deepseek-ai/dsh-lark'

    - id: ui-lark
      name: '@deepseek-ai/dsh-client-ui-lark'

    # The Desktop products mount the native provider above; this section
    # toggles the runtime setting and renders only while that settings
    # namespace is served, including while `enabled` is false.
    - id: ui-computer-use
      name: '@deepseek-ai/dsh-client-ui-computer-use'

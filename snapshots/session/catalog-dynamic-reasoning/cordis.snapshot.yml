# Keyless replay serves fixed catalog facts from a local HTTP fixture.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: model-catalog
  name: '@deepseek-ai/dsh-model-catalog'
  config:
    catalogURL: http://127.0.0.1:43119/catalog.json?type=all

- id: agent-default-model
  config:
    provider: minimax-cn-custom
    model: MiniMax-M2.7-highspeed

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      minimax-cn-custom:
        api: openai-responses
        baseURL: https://api.minimax.cn/v1
        models:
          - id: MiniMax-M3
          - id: MiniMax-M2.7-highspeed

- insert:
    - id: catalog-reasoning-fixture
      name: './catalog-reasoning-fixture.mjs'

    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers: []

    - id: model-switch-driver
      name: './model-switch-driver.mjs'

    - id: legacy-tools-scheduler-compat
      name: './legacy-tools-scheduler.mjs'
